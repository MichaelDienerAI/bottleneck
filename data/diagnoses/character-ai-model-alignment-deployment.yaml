  - >
    The third TPM requisition (Technical Program Manager, Product Experience,
    reported posted 2026-06-30) is reported by search but I could not render it,
    so the method 5 claim is written as two concurrent TPM reqs rather than three.
    A rendering URL would strengthen it.
  - >
    THE HIRING MANAGER, both name and title. Only two unconfirmed aggregator
    candidates exist and the posting has no reporting line. A dated Character.AI
    engineering blog byline, a conference talk, or a commit authored under a
    character.ai address on judgejudy would establish a real name and is the
    cheapest route — judgejudy has only 28 commits, so its contributor list is
    short enough to read in full.
  - >
    THE RENT FIGURE IN relocation_price IS AN ESTIMATE, not a cited measurement.
    The California and Arizona tax rates are published and checkable; the
    ~$3,100 vs ~$1,450 one-bedroom comparison is not sourced to a dated index. A
    Zillow or RentCafe reading for Redwood City and Phoenix on a stated date would
