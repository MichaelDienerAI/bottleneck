  - >
    Three evidence rows exceed the ten-second verification threshold and are
    flagged rather than smoothed: the judgejudy README row at 20s (16KB file,
    requires scanning the evaluator list), the ACL paper row at 25s (long HTML,
    requires finding Section 7 because the abstract headlines Replika only), and
    the under-18 announcement row at 12s. All three are real and openable; they
