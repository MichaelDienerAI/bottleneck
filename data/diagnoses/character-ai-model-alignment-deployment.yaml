# Diagnosis — one drum slot, one company.
# Method: .claude/references/bottleneck-detection.md
#   Ladder methods used: 3 (aging/public WIP), 4 (refusal boundary), 5 (cause vs
#   symptom hiring), 6 (specificity leak), 12 (open-role distribution — ATTEMPTED
#   AND ABANDONED, see gaps). Method 2 (instrumented measurement) NOT run by me;
#   a third party's equivalent measurement is used instead and labelled as such.
# hypothesis_source: data/queue.json, key ashby:Character.AI:091a6ad6-75dd-4dd4-9439-7e1e9d13970b
# time_started: 2026-08-13
# time_completed: 2026-08-13
# archetype_match_confidence: high — Character.AI is the canonical consumer
#   companion-chat product (20M monthly visitors, multi-turn open-ended persona
#   chat). conversational_ai fits without forcing. No manual routing needed.

company: Character.AI
role: Technical Program Manager, Model Alignment and Deployment
url: https://jobs.ashbyhq.com/character/091a6ad6-75dd-4dd4-9439-7e1e9d13970b
archetype: conversational_ai

dated: '2026-08-13'

constraint_hypothesis:
  weakest_link: >
    Character.AI produces no more open-ended chat sessions than its slowest part —
    pre-deployment behavioral evaluation of multi-turn persona conduct under
    sustained emotional pressure — allows.
  binding_part: >
    Pre-deployment behavioral evaluation of multi-turn persona conduct under
    emotional pressure. The claim is NOT that no gate exists — I cannot see
    inside their pipeline and do not assert it. The claim is that whatever gate
    exists is not catching the dominant failure mode. An independent ACL 2026
    replication measured a 35.7% harmful-response rate on Character.ai across
    1,586 dialogue pairs, concentrated in supportive-reinforcement-and-mirroring
    replies to Risk Intent (60.3%) and Harmful Belief (34.6%), with
    boundary-keeping emotions near-absent. The one evaluation harness Character.AI
    has published, judgejudy, scores single generations against a rubric and ships
    no multi-turn, persona-consistency, safety, or toxicity evaluator.
  output_capped: >
    Users eligible for open-ended chat. Countable as user segments served on the
    open-ended surface: currently one (18+), down from all ages. Character.AI
    removed open-ended chat for every under-18 user effective no later than
    2025-11-25 rather than certify the behavior for that segment, and as of 2026
    the removal stands with age assurance enforcing it.
  confidence: medium

acquittal: EVIDENCE_SUFFICIENT

evidence:
  - claim: >
      Character.AI's only public evaluation harness is character-ai/judgejudy,
      described by the org itself as "Eval Harness". Created 2026-03-25, last
      pushed 2026-07-06 (38 days before this reading), MIT licensed, Go, 18 stars,
      2 forks, 0 open issues, not archived, not a fork. This establishes that the
      company mechanizes evaluation and publishes when it does — which is why the
      shape of what it does NOT cover is readable rather than merely absent.
    inspectable_at: https://api.github.com/repos/character-ai/judgejudy
    verify_seconds: 8
    source_class: backstage
    strength: 5

  - claim: >
      judgejudy's built-in evaluator set is single-output only. The README lists
      an AI judge scoring one output against a rubric (pointwise scoring and
      pairwise comparison) plus reference and reference-free metrics: bertscore,
      rouge, bleu for text; clip_score, fid, lpips, ssim for image; pesq, stoi,
      utmos for audio; temporal_consistency, clip_temporal for video. It ships no
      multi-turn conversation evaluator, no persona-consistency evaluator, and no
      safety or toxicity evaluator. This is an absence WITHIN one named document a
      stranger can Ctrl-F, not an absence claim across an org — deliberately
      scoped that way so it is checkable.
    inspectable_at: https://raw.githubusercontent.com/character-ai/judgejudy/main/README.md
    verify_seconds: 20
    source_class: backstage
    strength: 4

  - claim: >
      A third-party instrumented measurement of Character.AI's live product, dated
      and reproducible: "Persona-Grounded Safety Evaluation of AI Companions in
      Multi-Turn Conversations" (Juneja and Lomidze, submitted 2026-04-30, ACL
      2026) replicates its pipeline on Character.ai across 9 personas and 25
      scenarios, collecting 1,586 dialogue pairs, and reports verbatim: "The
      overall harmful response rate is 35.7%." Harm concentrates in supportive
      reinforcement and mirroring responses to Risk Intent (60.3%) and Harmful
      Belief (34.6%); "Character.ai exhibits a similarly concentrated emotional
      range (Neutral 46.9%, Caring 15.1%), with boundary-keeping emotions
      near-absent." NAVIGATION WARNING so a stranger does not conclude I misread:
      the abstract headlines Replika only; the Character.ai replication sits in
      Section 7 and Appendix A.7. The measurement post-dates the under-18 removal,
      so it reads the adult product as currently shipped.
    inspectable_at: https://arxiv.org/html/2605.00227
    verify_seconds: 25
    source_class: backstage
    strength: 5

  - claim: >
      The refusal boundary, dated. Character.AI announced on 2025-10-29 that it
      would remove "the ability for users under 18 to engage in open-ended chat
      with AI on our platform," effective "no later than November 25." The company
      withdrew an entire user segment from its core surface. The announcement
      attributes this to news reports and regulator questions and contains no
      admission about model behavior, classifier performance, or evaluation
      limits — the withdrawal itself is the capacity signal, not the prose.
    inspectable_at: https://blog.character.ai/u18-chat-announcement/
    verify_seconds: 12
    source_class: frontstage
    strength: 3

  - claim: >
      SPECIFICITY LEAK, labelled as such and front stage by definition. The target
      posting hands this TPM "Vendor & partner management: Own external partner
      relationships supporting these workstreams, including general and
      safety-focused annotation vendors, evaluation tooling providers, and data
      partners," and separately asks them to "Develop and maintain custom
      evaluation frameworks." Two details survived review that template language
      would not: safety evaluation is currently bought as human annotation labor
      from outside vendors, and the evaluation framework is to be developed rather
      than operated. The posting also uses the word "bottlenecks" directly
      ("Identify bottlenecks across teams"). Cited only as corroboration of the
      backstage rows above; no row in this file rests on the posting alone.
    inspectable_at: https://jobs.ashbyhq.com/character/091a6ad6-75dd-4dd4-9439-7e1e9d13970b
    verify_seconds: 15
    source_class: frontstage
    strength: 3
    specificity_leak: true

  - claim: >
      A second, concurrent Technical Program Manager requisition renders live at
      Character.AI: "Technical Program Manager, AI Infrastructure," covering
      programs across training, evaluation, and inference. Two concurrent TPM reqs
      is method 5 — coordination capacity bought in bodies, which is the most
      expensive way to buy it and therefore marks where no cheaper mechanism
      exists. A third TPM req (Product Experience, reported posted 2026-06-30) is
      reported by search but I could not render it, and it is excluded from this
      claim.
    inspectable_at: https://jobs.ashbyhq.com/character/fd023b84-a746-4fe9-8a9d-277899e67a78
    verify_seconds: 8
    source_class: frontstage
    strength: 3

  - claim: >
      Character.AI is an agent-native engineering shop, which inverts a standing
      ledger gap rather than tripping it. judgejudy ships a .claude directory in
      its repository root, and the org's most recently updated repository,
      character-ai/larch, is described as "Claude configuration and skills"
      (updated 2026-08-13, the date of this reading). proof-ledger.yaml known_gap
      2 says Michael's work is agent-assisted and directs him to target companies
      that treat agent-native development as an advantage. This is one.
    inspectable_at: https://api.github.com/repos/character-ai/judgejudy/contents/
    verify_seconds: 8
    source_class: backstage
    strength: 4

disconfirming:
  query_issued: >
    PRIMARY KILL QUERY, issued after the hypothesis was written: does Character.AI
    already publish an automated evaluation harness? Killing condition stated in
    advance — if an active public eval harness covers conversational behavior,
    then evaluation is already mechanized, the req adds capacity at a
    non-bottleneck, and P3 applies. Run as an org repository listing sorted by
    update time (https://github.com/orgs/character-ai/repositories?sort=updated),
    then followed into the repo metadata and README rather than stopping at the
    listing.
    SECOND KILL QUERY: has the constraint since been relieved? "Character.AI 2026
    restore open-ended chat under 18 teens reinstated age verification." If the
    under-18 surface came back, the capacity limit was reached and cleared, and a
    cleared limit is not a constraint.
    THIRD KILL QUERY: has Character.AI itself published multi-turn safety or
    persona-consistency evaluation work? "Character.AI research blog safety
    classifier multi-turn evaluation persona consistency 2026." Their own
    published multi-turn safety eval would kill the narrowed hypothesis outright.
  result: >
    PRIMARY: PARTIALLY FIRED, and the hypothesis is narrowed rather than confirmed.
    character-ai/judgejudy exists and is real — "Eval Harness," created 2026-03-25,
    pushed 2026-07-06, MIT, 18 stars. Character.AI does mechanize evaluation. The
    hypothesis survives ONLY narrowed to multi-turn behavioral evaluation, and that
    narrowing is carried by the README's own evaluator list, which is single-output
    throughout and contains no multi-turn, persona, safety, or toxicity evaluator.
    I record this as a partial kill, not a survival, because the falsifier I wrote
    in advance was partly satisfied.
    SECOND: NOTHING that relieves it. The under-18 removal stands into 2026 and is
    reported as a permanent structural change, with age assurance rolled out in
    early 2026 and adult users being misflagged and locked out. The segment was not
    restored. Hypothesis survived.
    THIRD: NOTHING from Character.AI. No Character.AI-authored multi-turn safety or
    persona-consistency evaluation is in the public record. The query instead
    surfaced a third party measuring them (ACL 2026, 35.7% harmful) — which is
    confirming rather than disconfirming, and is exactly the reading Character.AI
    did not publish about itself.
  survived: true

