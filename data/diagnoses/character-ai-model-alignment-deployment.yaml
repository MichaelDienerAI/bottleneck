proof_match:
  asset: >
    deformation_test_bank (Deformation Test Bank) is the asset that actually acts
    on this constraint. test_harness (test-mra.js) is the closest asset that is
    currently inspectable.
  tier: speculative
  acts_on_constraint: true
  mechanism: >
    The Deformation Test Bank is a three-phase protocol — Baseline, Pressure,
    Return — with objective coding rules, and proof-ledger.yaml records that it has
    ALREADY been applied to Character.AI, documenting where personas accept false
    premises, apologize for things they never said, and invent relational memories.
    That is the same failure class the ACL 2026 replication measured at 35.7%:
    unqualified emotional alignment, supportive reinforcement and mirroring, and
    boundary-keeping behavior that never fires. It is the exact evaluator judgejudy
    does not ship. The match is closer here than at any company yet examined.
  why_tier_is_speculative_and_not_sovereign: >
    THIS IS THE WHOLE VERDICT, so it is stated plainly rather than smoothed.
    proof-ledger.yaml lists deformation_test_bank under `sovereign:` but its
    inspect_at is the literal string TODO_PUBLIC_URL. By the ledger's own opening
    definition — "Sovereign = a stranger can inspect it without asking Michael for
    anything" — it is not sovereign today. A stranger cannot open it. The Deepgram
    audit flagged this same defect and confirmed it unfixed on 2026-08-13; it is
    still unfixed. The ledger's label and the ledger's definition disagree, and the
    definition governs.
  fallback_asset_assessed: >
    test_harness IS sovereign and IS inspectable — I confirmed test-mra.js present
    at the aline-backend repository root on 2026-08-13, 12,335 bytes, at
    https://github.com/MichaelDienerAI/aline-backend/blob/main/test-mra.js. It
    covers drift, sycophancy, fabricated continuity, dependency-seeking behavior,
    and conflicts between character consistency and crisis duty of care — the last
    of which is precisely the measured Character.AI failure. But per the Deepgram
    audit's finding, its subject under test is the Calibration Layer, which is
    written and test-exercised and NOT wired into the deployed path. So the
    inspectable asset is a hand-run JavaScript harness against a staged subject,
    and it has never been run against Character.AI. Leading a packet with it
    against a production failure measured at 35.7% would overstate.
  known_gaps_respected: >
    Gap 1 (ML / fine-tuning): LIVE RISK HERE, unlike at Deepgram. The req asks for
    "Deep familiarity with post-training and alignment concepts (supervised
    fine-tuning, RLHF, AI safety frameworks, LLM evaluation)." Familiarity is
    arguable from the Innodata RLHF evaluation work, but that work is speculative
    tier and NDA-bound, so it may index and never lead. No packet may claim
    training-loop, DPO, or Constitutional AI implementation capability.
    Gap 2 (agent-assisted development): INVERTED INTO AN ASSET. Character.AI ships
    a .claude directory inside judgejudy and its most recently updated repo is
    Claude configuration and skills. This is the company class the ledger names as
    a target.
    Gap 3 (Calibration Layer): must be stated as written and test-exercised, never
    as wired into the deployed path. This is load-bearing here because test-mra.js
    is the fallback asset and the Calibration Layer is its subject.
  honest_shortfall: >
    Role fit is weaker than constraint fit, and the two must not be blurred. This
    is a Technical Program Manager requisition asking for 5+ years of technical
    program management or research operations, proficiency in SQL and Python, and
    management of external annotation vendors. proof-ledger.yaml evidences none of
    those three. What Michael holds is the evaluation methodology the program would
    need, not a record of running programs. A packet that presents a methodology
    artifact as program-management experience is the overstatement the auditor
    exists to catch.

decision_maker:
  name: ''
  title: >
    NOT ESTABLISHED for this requisition. The posting carries no reporting line —
    I read the full description and it names five partner teams (Post-Training,
    Safety Engineering, Trust & Safety, ML Infra/Model Serving, UXR) and no
    manager. Two candidate titles exist in aggregator sources and neither is
    confirmed as the hiring manager: "Head of Post-training and Data (Research)"
    (RocketReach) and "Head of Trust and Safety" (theorg.com). Both aggregators are
    crowd-sourced or scraped and may be stale. Recording them as candidates, not as
    the answer, and guessing between them is exactly the move the project
    instructions forbid.
  reachable_via: >
    The ATS is currently the only established path, and that alone is a PARK
    condition under the verdict rules. One genuine non-ATS surface exists and is
    worth more than the ATS: judgejudy is MIT licensed, has CONTRIBUTING.md,
    permits pull requests, and carries 0 open issues, so a well-formed
    contribution would be read rather than buried. A PR or issue adding a
    multi-turn persona-consistency evaluator to judgejudy would reach Character.AI
    engineering directly AND be the proof at the same time — the diagnosis and the
    artifact collapsing into one object, which is the whole logistical advantage.
  source: >
    Target posting read in full from data/queue.json (no reporting line present);
    https://theorg.com/org/character-ai/org-chart ; RocketReach management listing
    surfaced by search. All three are weak and none is a backstage trace.

verdict: PARK
reason: >
  The constraint is the most legible I have read so far and it is NOT why this
  parks. Four independent legs support it: a dated third-party measurement of the
  live product at a 35.7% harmful-response rate concentrated in sycophantic
  mirroring; a public eval harness whose own README shows it cannot evaluate that
  failure mode; the permanent withdrawal of an entire user segment rather than
  certification of it; and two concurrent TPM requisitions buying coordination and
  annotation-vendor capacity in bodies.
  It parks on the proof match, on two counts, either of which alone is sufficient.
  First, the asset that actually acts on this constraint — the Deformation Test
  Bank, which has already been run against Character.AI and documents exactly the
  false-premise acceptance and invented relational memory the ACL paper measured —
  has inspect_at: TODO_PUBLIC_URL and therefore fails the ledger's own definition
  of sovereign. A stranger cannot open it, so it cannot lead a packet. The
  inspectable fallback, test-mra.js, is a hand-run harness against a staged
  subject and would overstate against a production failure rate.
  Second, the decision-maker path runs entirely through the ATS with no
  hiring-manager title established, which the verdict rules name as a PARK
  condition on its own.
  This is a high-value park, not a dismissal. One URL converts it. Publishing the
  Deformation Test Bank makes Character.AI the single best-matched company in the
  pool, because the Test Bank was already pointed at this exact product and the
  independent literature now corroborates what it found. Re-take a slot the week
  that URL exists.

