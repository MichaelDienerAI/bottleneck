    ESTIMATE, not a cited measurement — see gaps.
    Total recurring delta ~$31-32K/yr, about 13% of the $240K midpoint.
    One-time move: ~$5-8K.
  purchasing_power_read: >
    The $220K band floor is worth roughly $188K in Phoenix-equivalent terms after
    the recurring delta. That still clears the search's compensation floor
