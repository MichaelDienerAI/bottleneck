      Five Voice Agent defects opened against the official Python SDK on a single
      day, 2026-08-11. Four name the aws_bedrock think provider. #759 "Voice Agent
      aws_bedrock think provider returns no output and no error" is a SILENT
      failure — no output and no error path fired, meaning no canary caught it.
      #760 "agent.greeting makes the first aws_bedrock request [fail]" is a
      first-turn defect. #761 type hints list two unavailable model IDs. #762
      reasoning_mode undocumented, two of its five accepted values fail. #763 groq
      think provider documented as BYO with a required endpoint. Confirmed live by
      me on 2026-08-13; none shows an assignee.
    inspectable_at: https://github.com/deepgram/deepgram-python-sdk/issues?q=is%3Aissue+is%3Aopen+sort%3Acreated-desc
    verify_seconds: 20
    source_class: backstage
    strength: sovereign

  - claim: >
      Deepgram already attempted to staff model evaluation once and is back in the
      market. A "Model Evaluation QA Lead" req (Ashby id 1111c5de-2f90-4f38-a353-115a64a9ca33,
      listed on Remotive 2026-02-09) is no longer live: the Remotive listing returns
      HTTP 410 Gone, and its Ashby URL renders no title while the live target req at
      the same host renders "Senior Software Engineer - Model Evaluation & AI Systems
      @ Deepgram" under an identical fetch. It is also absent from the 2026-08-13
      board snapshot. A differently-titled evaluation req opened 2026-07-28, roughly
      5.5 months later. Method 8: the constraint survived their attempt to relieve it.
    inspectable_at: https://remotive.com/remote/jobs/qa/model-evaluation-qa-lead-3618128 (410 Gone) vs https://jobs.ashbyhq.com/deepgram/6f3d761e-4873-43af-a9b1-daeb147661f9 (renders)
    verify_seconds: 30
    source_class: backstage
    strength: sovereign

  - claim: >
      The withdrawn Model Evaluation QA Lead description states the role reports to
      the QA Engineering Manager and partners with the Active Learning and Data Ops
      teams, and that its job was "automated model evaluation pipelines that run
      against every candidate model before release." This is a second, independent
