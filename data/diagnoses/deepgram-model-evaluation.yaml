      day, 2026-08-11. Four name the aws_bedrock think provider. #759 "Voice Agent
      aws_bedrock think provider returns no output and no error" is a SILENT
      failure — no output and no error path fired, meaning no canary caught it.
      #760 "agent.greeting makes the first aws_bedrock request [fail]" is a
      first-turn defect. #761 type hints list two unavailable model IDs. #762
      reasoning_mode undocumented, two of its five accepted values fail. #763 groq
      think provider documented as BYO with a required endpoint. Confirmed live by
      me on 2026-08-13; none shows an assignee.
    inspectable_at: https://github.com/deepgram/deepgram-python-sdk/issues?q=is%3Aissue+is%3Aopen+sort%3Acreated-desc
    verify_seconds: 20
    source_class: backstage
    strength: sovereign

  - claim: >
