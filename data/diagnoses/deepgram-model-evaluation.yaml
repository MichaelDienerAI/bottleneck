    line on Deepgram's live Voice Agent. A fired S3 signature, fabricated
    continuity, or a barge-in latency over 0.5s would turn confidence from low
    to high and would become the packet's lead artifact. It would also convert
    proof_match.acts_on_constraint from false to true, because the measurement
    is taken on the constrained surface itself.
  - >
    Whether Deepgram is working these defects in a private tracker. GitHub shows
    no assignee and no maintainer reply on #759 and #760. That is not the same
    as no work. A maintainer comment naming an internal ticket, or a linked
