verdict: PARK

reason: >
  Why it is stuck. Deepgram checks the Voice Agent third-party think-provider
  path by hand. On 2026-08-11 one developer advocate worked through that path
  and wrote up five findings. Two are real behavioral defects, including a turn
  that vanishes with no output and no error. Nothing automated caught them
  first, because nothing automated covers that path. Three days later both are
  still open with no assignee, and a release shipped in between that did not
  address them. Because the check is a person, its capacity is one person's
  attention, and integrations wait behind it.
  Why an obvious fix would not work. Writing more tests is the wrong guess. The
  org already knows how to build an evaluation harness. It built one for smart
  formatting, with a runner, an evaluator, and a dated results file. That
  harness ships with no CI workflow and a README of commands a person types. So
  the missing thing is not test-writing skill. The missing thing is a gate that
  runs the tests before a release.
  Why this parks instead of shipping. Michael's harness is also run by hand. It
  has never run against a vendor API, and it has never touched Deepgram's Voice
  Agent. On the methodology axis it matches well. On the mechanism axis it does
  not act on the named part. One hour with a microphone changes that, because
  data/protocols/deepgram.md turns the diagnosis and the proof into the same
  object. Until then the packet would lead with a harness for a companion
  chatbot rather than a reading of their product, which is what the auditor
  rejected the first time.
  What to do with the evidence. Run the protocol. Then re-open this row. The
  constraint is legible, dated, and cited. What is missing is Michael's own
  number on their surface.

