constraint_hypothesis:
  binding_part: >
    The Voice Agent third-party "think provider" integration path has no automated
    pre-release behavioral gate. Four customer-reported defects on that single
    surface opened on one day, 2026-08-11, and none carried an assignee two days
    later. The first automated check on that surface is a customer filing an issue.
  output_capped: >
    Voice Agent releases and BYO/third-party model integrations that reach GA
    without a customer-reported behavioral defect. Countable as: defects per
    release on the think-provider surface. Currently 4 in one day on one provider
    (aws_bedrock), 5 total that day across Voice Agent surfaces.
  confidence: medium

# Weakest Link form:
#   Deepgram ships no more validated Voice Agent think-provider integrations than
#   its manual pre-release behavioral check allows.

evidence:
