disconfirming:
  query_issued: >
    PRIMARY KILL QUERY (issued after hypothesis formation): "Deepgram github public
    evaluation harness benchmark repository WER regression testing". Designed to kill
    the hypothesis outright — if Deepgram already ships a public, actively-maintained
    eval/benchmark harness, then evaluation is already mechanized, the req adds
    capacity at a non-bottleneck, and P3 applies (a limit not reached is not a
    constraint).
    SECONDARY KILL QUERY: "Deepgram 'Model Evaluation QA Lead' OR 'Engineering
    Manager, Active Learning' job opening" — designed to test the brief's
    two-concurrent-reqs claim in both directions.
    THIRD (attempted, failed): live read of
    https://api.ashbyhq.com/posting-api/job-board/deepgram?includeCompensation=true
    to recount the board independently.
  result: >
    PRIMARY: no public Deepgram evaluation harness, benchmark-methodology repo, or
    reproducible regression suite found across the org. Only a marketing benchmark
    page with no methodology. Hypothesis SURVIVED. The same query surfaced
    deepgram/examples #276, which initially looked like strong confirmation and which
    I downgraded to circumstantial on direct inspection once I saw the bot authorship
    and the 75-item unassigned backlog it sits in.
    SECONDARY: KILLED the concurrency sub-claim. The Model Evaluation QA Lead req is
    NOT concurrently open — Remotive returns HTTP 410 Gone and the Ashby URL renders
    no title under a fetch that renders the live req's title. But it converted the
    claim into something stronger: a sequential re-attempt at the same function
    ~5.5 months apart, which is method 8 and confirms rather than hypothesizes the
    constraint.
    THIRD: FAILED. WebFetch truncated the JSON at 6 of ~79 titles. I could not
    independently recount the board and therefore treat the brief's "exactly one of
    79 titles contains Eval" as unverified. It is not load-bearing for this diagnosis.
  survived: true

proof_match:
  asset: test_harness (Adversarial evaluation harness, test-mra.js) — lead asset; persona_io — corroborating credential
  tier: sovereign
  acts_on_constraint: true
  mechanism: >
    test-mra.js is a standalone behavioral evaluation harness with objective coding
    for drift, sycophancy, and fabricated continuity — precisely the class of silent
    conversational failure that #759 represents, where the agent returns no output
    and no error and nothing fires. Michael has already built the pass/fail
    methodology layer the posting asks for ("translate expectations into automated,
    enforceable pass/fail gates"), and it is publicly readable in the aline-backend
    repo. persona_io corroborates: its depends_on list names Deepgram, so he is a
    production Deepgram customer running a multi-vendor real-time voice pipeline
    under 800ms — he is already load-testing the exact surface the constraint sits on.
  known_gaps_respected: >
    Gap 1 (ML/fine-tuning): CLEAR. The role requires eval infrastructure, thresholds,
    and statistical reasoning about regressions — not training loops or loss design.
    Nothing in a packet may claim fine-tuning capability. Innodata RLHF work is
    speculative and NDA-bound; it may index, never lead.
    Gap 2 (agent-assisted development): INVERTED INTO AN ASSET. Deepgram's posting
    demands it — "AI use and comfort aren't optional... even build your own into your
    everyday work. We measure how effectively AI is applied." This is the exact
    company class the ledger's disposition names as a target.
    Gap 3 (Calibration Layer): must be stated as written and test-exercised, never
    as wired into the deployed path.
  honest_shortfall: >
    The posting asks for 5+ years shipping test infrastructure, Python/Rust/Go, and
    orchestration against large GPU clusters. test-mra.js is JavaScript and
    single-purpose, and is not wired into CI. The proof acts on the METHODOLOGY axis
    of the constraint, not the orchestration-at-scale axis. A packet that blurs this
    overstates and must be rejected by the auditor.

decision_maker:
  name: INSUFFICIENT_EVIDENCE — no named human established. A dated org announcement, a conference talk byline, or a commit under a deepgram.com address on an eval-related repo would settle it. Never guess.
  title: QA Engineering Manager
  reachable_via: >
    Two paths. (1) Ashby ATS on the target req — the default, and weak. (2) A
    non-ATS public engineering surface: the five unassigned 2026-08-11 issues on
    deepgram/deepgram-python-sdk, where Deepgram engineering demonstrably reads and
    triages in public. A reproducible repro plus a behavioral test case filed there
    reaches the same function without going through the ATS. careers@deepgram.com is
    named in the posting but is a generic inbox, not a decision-maker path.
  source: >
    Title comes from the withdrawn "Model Evaluation QA Lead" req description
    ("Reporting to the QA Engineering Manager"), a SEPARATE posting from the target,
    recovered via search index. That the target req reports to the same manager is
    INFERENCE, marked as such. The target posting carries no reporting line.

