verdict: PARK
reason: >-
  The constraint is legible and a sovereign proof acts on it, but there is
  nowhere to send a packet. Here is the chain. Synthesia raised $200 million in
  January 2026 on a story about avatars that talk back. In August 2026 the page
  for that product still says closed beta, and access runs through a form a human
  reviews. So demand for interactive avatars is set by the funding story, and
  supply is set by how many teams Synthesia can hand-onboard. That gap is the
  bottleneck, meaning the one part whose capacity sits closest to its load and
  therefore caps everything downstream. The obvious guess is that Synthesia needs
  more implementation people. That guess is wrong, and I killed it with a query:
  Synthesia already lists 21 or more outside service partners and an internal
  services team. Bodies are not the missing piece. What is missing is a proven
  reference build of the customer-side stack, so each new team stops solving the
  same real-time wiring problem from scratch. Michael holds one, live, at
  personaio.app. But the Solutions Architect role that opened on 2025-11-21 is
  gone from the public feed as of 2026-08-13, and no named human is reachable, so
  the decision-maker path runs entirely through an ATS that no longer lists the
  job. Spending one of five weekly packet slots on a closed requisition is waste.
  Park it. If Synthesia reopens a role on the Interactive Avatars surface, this
  diagnosis is ready and the proof already exists. Note for the record: the queue
  row is stale, which is a scanner problem worth fixing upstream.
gaps:
  - >-
    No record shows whether the Solutions Architect role was filled or dropped.
    An Ashby feed snapshot from between 2025-11-21 and 2026-08-13, or a named
    Solutions Architect at Synthesia, would settle it. It matters because filled
    and abandoned point at different constraints.
  - >-
    No public count exists of how many teams are in the Interactive Avatars beta.
    A dated beta cohort number, or a general-availability announcement, would
    turn my capacity estimate into a measured one. Right now the closed gate is
    the only reading I have.
  - >-
    Michael has not run his own stopwatch against a Synthesia Interactive Avatar,
    because access is gated by the request form. Until he does, the latency claim
    rests on his own product, not on theirs. Submitting the early access form is
    the cheapest way to close this gap.
  - >-
    No hiring manager name or title is known. Synthesia publishes no team page
    for Solutions Consulting, and LinkedIn is out of bounds under project rules.

