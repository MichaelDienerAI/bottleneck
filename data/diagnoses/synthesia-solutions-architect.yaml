  struck:
    - claim: >-
        Evidence row 1: "This is a specificity leak: a marketing page normally
        hides what a product cannot do yet, and this one names it."
      reason: >-
        This fails the prove-the-claim test on the label, not on the facts. A
        leak is a place where a company lost control of its own story. This page
        did not lose control. It names its limits twice on purpose. Once in the
        beta notice, and again lower down: "We are actively improving quality,
        expressiveness, listening behaviors, interruption handling, latency, and
        repeatability across sessions." Copy that repeats its own limits in two
        places is on message. Synthesia wrote it to set expectations and to
        filter who asks for access. Nothing slipped out. Deleting the word
        "leak" and keeping strength 4 does not save the row either. Strength 4
        means nearly sovereign, and a vendor page describing a vendor product is
        the vendor's account of itself. What survives is narrower and still
        useful. A company is the primary record of its own access policy, so the
        page is good evidence that a closed beta exists. It is not evidence of
        what the product cannot do.
      rewrite: >-
        Synthesia's product page says Interactive Avatars runs as a closed beta
        and that access runs through an early access form a human reviews. The
        page names four things Synthesia is testing: quality, latency,
        integration patterns, and enterprise requirements. This is Synthesia
        describing its own access policy, which is the strongest available
        source for that one fact. Set strength to 3 and remove specificity_leak.
    - claim: >-
        Evidence row 2: "Synthesia's public developer changelog shows five
        entries in total."
      reason: >-
        This fails the prove-the-claim test on the only countable fact in the
        row. I opened the changelog and counted four entries: "Synthesia APIs
        are generally available," two entries titled "API Improvements," and
        "New Dubbing & Assets APIs." A stranger who counts gets four. The row
        says five. Changing five to four does not repair the row by itself. The
        entry count was never the load-bearing part, the release gap was, and
        the page prints relative ages instead of calendar dates, so "roughly
        eight months" is as precise as the source allows and the row should say
        so out loud. What survives is the gap. Synthesia has not shipped a
        documented change to its developer surface in about eight months, and
        that is the fact that speaks to the constraint.
      rewrite: >-
        Synthesia's public developer changelog shows four entries. The newest
        one is labeled about eight months old when read on 2026-08-13, so the
        developer surface has shipped no documented change since roughly
        December 2025. The page prints relative ages, not calendar dates, so the
        gap can be read but not pinned to a day.
    - claim: >-
        Evidence row 4: "Solutions Consultant in Austin, published 2025-02-12
        and still open on 2026-08-13, which is eighteen months."
