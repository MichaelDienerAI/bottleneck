# Read by `node src/casefile.js --record`, which writes it into the case file
# beside the cooling date. A park with a date and no trigger is a date with no
# reason, so this names what must change before the row is worth reopening.
revisit_trigger: >-
  customer-facing pre-sales requirement dropped or dedicated agent evaluation role
  opened

reason: >-
  Why it is stuck. Decagon sells only through people. The only button on
  decagon.ai is "Get a demo." A buyer cannot sign up, start a trial, or open a
  sandbox. So before any enterprise buyer watches Decagon work on their own data,
  a Decagon Solutions Engineer has to build that demo by hand. Every deal passes
  through that one team. That makes Solutions Engineering the bottleneck here,
  meaning the one part whose capacity sits closest to its load, so it caps
  everything behind it. The rest of the public record fits. Decagon's job feed
  puts an Account Executive, a Director of Sales, a Strategic Account Director,
  and a Senior Solutions Engineer in Sales, runs a whole department called
  Deployment Strategists, and carries only two engineering roles. The newest
  posting of all is a Senior Technical Sourcer, published 2026-08-12. Decagon
  hired a recruiter to hire. That is what a company does when its growth plan runs
  on adding people rather than on adding a mechanism.

  How a fix would work, and the wrong guess. The obvious guess is that Decagon
  needs more Solutions Engineers, and that is exactly what this posting buys.
  Headcount is the most expensive way to buy capacity, which is why a company only
  spends it where it has no cheaper option. The cheaper fix is a starter demo a
  buyer can drive alone, so the engineer joins a conversation already in progress
  instead of starting one. Decagon already believes in that direction for
  customers it has signed: its Agent Operating Procedures page promises plain
  language editing "without engineering or vendor bottlenecks." Nothing public
  points that product at buyers who have not signed yet. The front door is still a
  form. Mark this as inference, not observation: I can show the gate exists and I
  cannot count how many buyers are waiting behind it. That is why confidence is
  medium.

  What to do with the evidence. Do not spend a packet slot here. Michael's
  strongest sovereign proof, meaning a deployed artifact a stranger can inspect
  without asking him for anything, is Persona iO. It proves he can build a
  real-time voice agent solo and ship it. It does not prove he can run an
  enterprise pre-sales cycle on someone else's platform, and that is the part this
  role is hired to relieve. Two other costs point the same way. The posting asks
  for 4 to 6 years of customer-facing pre-sales work, and Michael's ledger has
  none. The posting also says "We're an in-office company" while the location
  field says "Remote," and the title names the East territory, which is not
  Phoenix. Park the row. If Decagon opens a role on its voice runtime or on
  evaluating agent behavior, Persona iO and the adversarial evaluation harness
  both act on those parts, and this diagnosis is already half written.
gaps:
  - >-
    Two evidence rows verify in about 12 seconds, over the ten-second bar, and I
    am flagging them rather than rounding down. The two job-feed rows point at a
    large JSON file, so a stranger has to load it and search inside it. The
    rendered board at https://jobs.ashbyhq.com/decagon would be faster, but it
    draws itself in the browser and my fetch returned only the page title, so I
    did not cite a page I could not read. The status page row and the homepage row
    both verify in under 10 seconds and they carry the argument.
  - >-
    I could not read the target posting myself. The Ashby posting page draws
    itself in the browser and my fetch returned nothing. The posting text I quote
    comes from Decagon's own board API feed as captured in data/queue.json. I am
    saying so rather than pretending I opened the page. A saved copy of the
    rendered posting would settle it.
  - >-
    I could not confirm the target posting is in Decagon's live board feed. My
    three fetches of the feed truncated before the array closed, returning 8 to 9
    readable entries out of a stated 10, so the posting may simply sit in the part
    I never saw. I am not claiming it was delisted. The scanner's own record says
    verified_live_at 2026-08-13 via the Ashby board API with url_check 200, and
    that dated record beats my truncated read. An untruncated feed capture would
    settle it.
  - >-
    Decagon's developer docs at docs.decagon.ai draw themselves in the browser and
    every fetch returned empty, including the raw-text paths. So I have no release
    notes, no changelog, and no API reference diff for Decagon. That is the single
    biggest hole here. A dated changelog would show whether the platform is
    shipping fast enough to shrink the per-customer human work, and I cannot see
    it.
  - >-
    Nobody has counted the thing I say is capped. No public record gives the
    number of enterprise buyers waiting for a Decagon demo, and none gives the
    number of Solutions Engineers Decagon has. I can show the gate and I cannot
    show the line behind it. A named count of the Solutions Engineering team, or a
    dated pipeline figure, would turn this from medium confidence into high.
  - >-
    Michael took no measurement of Decagon's live product. Decagon powers public
    support chat for named brands, so a real reading is reachable: open a customer
    support widget on one of the 17 logo sites and run the Deformation Test Bank
    protocol against it. My tools cannot hold a live chat session, so I could not
    do it. This is the cheapest gap to close and it would be the strongest single
    row in the file.
  - >-
    The Deformation Test Bank is the asset that would make such a measurement
    citable, and it still cannot lead anything. profile/proof-ledger.yaml records
    its inspect_at as TODO_PUBLIC_URL, so no stranger can open it. Publishing it at
    a real URL is a standing blocker across this whole search, not just this row.
  - >-
    No hiring manager is named. Decagon publishes no team page and no leadership
    page that names a Solutions Engineering leader. A recruiter reply naming the
    manager would settle it. It matters because the packet has nowhere to go
    without one, and that alone would hold this at PARK even if the proof matched.
  - >-
    The in-office versus Remote contradiction is unpriced, not resolved. No record
    says whether Decagon accepts a Phoenix-based engineer on an East territory, and
    none states the travel load. One recruiter question would settle it. Until
    then it stays a cost, not a fact.

