disconfirming:
  query_issued: >-
    Two queries, both issued after the hypothesis was written. First, I asked
    whether a prospect can try Decagon without talking to a human. If a trial or
    a sandbox exists, no engineer is needed to produce a first demo and the
    hypothesis dies. Second, I asked whether Decagon customers build and change
    their own agents without Decagon staff. If they do, then Decagon's growth is
    not gated on per-account humans and the wider version of my hypothesis dies.
  result: >-
    Split, and the second query hurt me. The first query held. Decagon's homepage
    carries only "Get a demo" and "Sign in." No trial, no signup, no sandbox. The
    second query killed the wording I started with. My first draft said a
    customer "cannot build an agent by itself." Decagon's Agent Operating
    Procedures page says the opposite: customers define agent behavior in plain
    language "without engineering or vendor bottlenecks," and Decagon published a
    post titled "What great self-serve actually looks like" by Katherine Xiao,
    Director of Implementations, dated 2025-05-04. I am not arguing that away.
    Both pages are Decagon's own marketing, which is frontstage, and frontstage
    does not outrank the backstage fact that Decagon runs a Deployment
    Strategists department. But they do narrow me. I dropped the broad claim and
    rewrote the binding part around the one stretch those pages never touch: how
    a buyer gets a first demo before becoming a customer. That narrower claim
    survived. Confidence stays at medium, not high, because of this.
  survived: true

