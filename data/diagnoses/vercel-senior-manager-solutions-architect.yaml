disconfirming:
  query_issued: >-
    Two kill queries, both issued after the hypothesis was written. My first
    hypothesis was that hand refactoring caps migrations. Kill query one: does
    Vercel ship a tool that automates a Cache Components migration, so no human
    has to refactor route by route? I read the codemod reference and the
    migrating-to-cache-components guide. My rewritten hypothesis was that hand
    verification caps migrations. Kill query two: does Vercel ship a build-time
    or CI gate that fails when a route is not instant, so no human has to check
    it? I read the instant navigation guide and the adoption skill.
  result: >-
    Query one killed hypothesis one, and I am recording that rather than hiding
    it. Vercel ships an agent skill, next-cache-components-adoption, that drives
    the refactor with a coding agent. The refactor is not the bottleneck. I
    rewrote the hypothesis around verification. Query two did not kill the
    rewrite, and it sharpened it. There is a CI path, but it is not a gate the
    framework runs. It is the instant() helper in @next/playwright, and a person
    has to write each test. The guide says so twice. It says the structural
    checks "can't tell you whether the right content is in it", and it tells the
    reader to "Focus these tests on the user flows that matter most", which is
    advice you only give when a team cannot cover them all. I then tried to kill
    the download-ratio reading by checking whether teams simply do not run
    end-to-end tests. That failed too: @playwright/test pulls 37.5 million
    weekly downloads against Next.js's 45.9 million. Teams run Playwright. They
    do not add the instant() helper.
  survived: true

proof_match:
  asset: test_harness
  tier: sovereign
  acts_on_constraint: false
  mechanism: >-
    The shape matches and the machine does not. Michael's test-mra.js turns a
    judgment a person used to make by eye into written pass or fail rules, one
    rule per failure class. That is exactly the move Vercel's constraint needs:
    turn "does this route show the right thing at first paint" into a rule a
    machine can run. But test-mra.js grades model conversation. It does not
    drive a browser, it does not assert on a static shell, and it has never been
    pointed at a Next.js route. Calling it an instant() suite would be the same
    stretch the Gray Swan audit struck, where a grader was offered against an
    authoring constraint. I am marking acts_on_constraint false rather than
    repeating that error.
  nearest_missing_proof: >-
    persona_io is deployed and its depends_on list already names Vercel, so
    Michael is a Vercel customer with a live app. A dated instant() reading of
    that app would be a sovereign proof aimed straight at this part. He has not
    taken it. Until he does, it is a next action, not an asset.

