verdict: PARK
reason: >-
  Why it is stuck. Vercel is moving its customers onto Cache Components in
  Next.js 16. The payoff is instant navigation. Vercel automated the boring half
  of that move: an agent skill does the refactor. It did not automate the check.
  Vercel's validator can only see that a static shell exists. It cannot see
  whether the right content is inside the shell, and Vercel says so in its own
  guide. The only tool that can see it is the instant() helper in
  @next/playwright, and a person has to write each test by hand, once for a page
  load and again for a click-through. Almost nobody writes them. In the week of
  2026-08-09 that package pulled 116,356 downloads against 45,881,963 for
  Next.js itself. That is one install for every 394. So the bottleneck, meaning
  the one part whose capacity sits closest to its load and therefore caps
  everything behind it, is the hand-written verification test. What it caps is
  countable: the number of customer routes anyone can prove are instant. That is
  the sign-off at the end of every enterprise migration an APAC Solutions
  Architect runs.

  How a fix would work, and the wrong guess. The obvious guess is that Vercel
  needs better migration tooling. That guess is wrong and Vercel's own repository
  kills it. The tooling exists. There is a codemod, an adoption skill, and an
  optimizer skill, all public. What is missing is the gate: a repeatable way to
  turn "this route shows the right thing immediately" into a test that runs
  without a person deciding what to assert. The adoption skill even proves the
  point against itself. Its own instructions say "Ambiguous calls are user
  check-ins, not agent judgment," and it stops at every feature boundary to ask.
  So the agent hands a decision back to a human once per product surface. On a
  large enterprise app that is a lot of human decisions.

  What to do with the evidence. Not this role, and not yet. Michael already runs
  a production app on Vercel, so he can take the measurement himself: install
  @next/playwright against personaio.app, write instant() tests for its main
  routes, and publish the dated result. That single act would convert this
  correct diagnosis into a sovereign proof, meaning a deployed artifact a
  stranger can inspect without asking him for anything. Right now he does not
  hold one that acts on this part, so the slot is released.

honest_shortfall: >-
  Three things I cannot support and will not soften. First, this posting is a
  people-management role: 8 or more years in Solutions Architecture with 2 or
  more years leading a team. Nothing in profile/proof-ledger.yaml is a record of
  leading a technical team or of enterprise pre-sales. Second, I proved that few
  teams install the instant() helper. I did not prove that this is what caps
  Vercel's APAC deal flow. That link is inference and I am marking it as
  inference. Third, npm download counts include continuous integration reruns
  and registry mirrors. They count installs, not teams. The ratio is
  directionally sound because both sides are inflated the same way, but it is
  not a headcount.

revisit_trigger: >-
  Reopen this when either of two public things happens. One, Michael publishes a
  dated instant() reading of a real Next.js app on a URL a stranger can open. At
  that moment he holds a sovereign proof aimed at the exact part named here, and
  the proof match flips from false to true. Two, Vercel posts a Solutions
  Architect or Field Engineering role based in the United States or genuinely
  remote in a US timezone. That removes the Sydney relocation cost and the
  location question stops mattering. Check the Vercel Greenhouse board monthly.
  Also worth a look: if weekly downloads of @next/playwright ever pass 1% of
  next, the constraint named here is relieving itself and this diagnosis is
  stale.

