strikes:
  claims_tested: 24
  claims_struck: 6
  struck:
    - claim: >-
        binding_part: "Only a person writing an instant() test can check that,
        one route at a time." Plus its restatement in weakest_link.
      reason: >-
        This fails Promise versus reality. Vercel ships a skill that writes the
        test. next-cache-components-optimizer sits in the same skills folder as
        the adoption skill this file cites. Vercel's AI agents guide lists what
        it does in three steps: "Writes a failing instant() test for the UI you
        named", then "Refactors the route until it passes", then "Commits the
        passing test with the refactoring." The page files it under "Unattended
        loops." So a person does not have to write each test. Dropping the words
        "hand-written" does not save the part, because the whole capacity
        argument rests on one person's writing time, one route at a time, and
        that is the number the skill changes. The weakest_link sentence also
        fails reading level. "Verified instant-navigation routes" is a four-word
        noun chain, and the appositive sits between the subject and the verb, so
        the reader holds the sentence open for seventeen words.
      rewrite: >-
        A person still decides what the instant UI should contain, route by
        route. Vercel's optimizer skill writes the test. It cannot pick the
        target. The guide says the agent "does need your app-specific intent"
        and tells the reader to "Tell it what should appear immediately, what
        can stream in, and what must stay fresh." So the named part is the
        per-route decision, not the typing. Confidence drops to low, because no
        public record counts those decisions or shows them backing up.
    - claim: >-
        disconfirming.result: "Query two did not kill the rewrite, and it
        sharpened it." Plus survived: true.
      reason: >-
        This fails Prove the claim. Kill query two asked whether Vercel ships
        something so that no human has to check each route. The answer sits on
        the page the query covered. The instant navigation guide this file
        quotes twice ends its AI workflow section with the optimizer skill,
        which "writes an instant() test that fails before the fix, then works it
        to green against a production-like build and ships it as a regression
        guard." The file's own reason paragraph names that skill and then never
        reads it. So the query came back with a killing answer and the result
        field recorded survival. Softening this to "no full CI gate exists" does
        not work. The dispute is not whether a gate exists. It is whether a
        person writes the test, and the guide answers that.
      rewrite: >-
        Query two came back with a partial kill. Vercel ships
        next-cache-components-optimizer. It writes the instant() test, refactors
        the route until the test passes, and commits it. What it does not do is
        decide what should be on screen at click time. Vercel hands that back to
        the user in writing. So the hypothesis narrows from writing tests to
        naming the target UI, and survived is false as written.
    - claim: >-
        Evidence row 2: "So the instant() helper is installed once for every 394
        installs of Next.js itself. That is 0.25%."
      reason: >-
        This fails Prove the claim. The ratio measures the package's age. In the
        week of 2026-01-05 @next/playwright drew zero downloads. In the week of
