    field engineering org chart. The record that would settle it is a recruiter
    reply naming the Field Engineering leader for APAC, or a Vercel team page
    listing that role. It matters because the only path in today is a Greenhouse
    form, and a form is not a named human.
  - >-
    I could not open SKILL.md as a raw blob. GitHub returned 403 on the blob
