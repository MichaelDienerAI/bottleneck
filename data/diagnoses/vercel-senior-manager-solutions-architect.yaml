gate0_check:
  flags_on_row: []
  blocking_flags_array_read_at: src/gates.js lines 223-229, read on '2026-08-16'
  blocking_prefixes_confirmed:
    - 'relocation_cost:'
    - 'country_only:'
    - 'remote_unverified:'
    - 'comp:unknown'
    - 'posted:unknown'
  result: >-
    No blocking flag fires in code. The row carries an empty flags array. The
    board published a posted date of '2026-08-10', so posted:unknown does not
    apply and the row is 6 days old against a 90-day limit. The row carries a
    published band, so comp:unknown does not apply.

  sydney_finding: >-
    The location string is "Remote - Australia". isRemote() matches on the word
    "remote", so locationFlags() checks only for an office signal inside that
    same string. There is none. It returns nothing. But the posting body says
    "This position will be based in Sydney, Australia." Gate 0 never reads the
    description for location. That is deliberate: locationFlags() takes
    job.location as its only location input, visible in the signature at
    src/gates.js:279 and in the remote branch at src/gates.js:286-291, and the
    comment block at src/gates.js:14-35 records that the gate accepts silent
    misses on purpose rather than widening its haystack. So remote_unverified
    did not fire on a role that names an office city.
  sydney_price: >-
    Here is my judgment, and I am stating it as judgment, not as a Gate 0 flag
    that does not exist. profile/gates.yaml lists Sydney in tier_3 and sets
    location.preference.stay_until to 2027-01-01, with Phoenix, AZ as the base.
    Today is 2026-08-16. So this role asks Michael to move to Sydney about four
    months before the date he said he would be ready to move anywhere. Had the
    location string read "Sydney, Australia", locationFlags() would have
    returned both location_tier:tier_3 Sydney and relocation_cost, and
    relocation_cost is a blocking prefix. The honest reading is that this row
    should carry a relocation cost and does not.
  sydney_effect_on_verdict: >-
    It does not change the verdict here, because the verdict is already PARK on
    the proof match. It would have mattered if this were a SHIP. Recorded so the
    next reader does not mistake a clean flags array for a clean location.

  comp_finding: >-
    The queue row records comp min 280000, max 350000, currency USD. The posting
    text says "$280,000 - $350,000 AUD". The currency label in the queue is
    wrong. extractCompFromText() read the numbers and stamped USD on them.
  comp_price: >-
    The band is Australian dollars, and it is on-target earnings, not base. I
    did not look up a dated exchange rate, so I will not quote a converted
    figure. The arithmetic that matters needs no rate: the $130,000 USD floor in
    profile/gates.yaml is 46% of 280,000. The band therefore clears the floor at
    any AUD/USD rate above about 0.47, and the rate has not been near that in
    decades. So the floor holds. What is not settled is how far above the floor
    it sits, and no dated record in this repository fixes the currency label.

