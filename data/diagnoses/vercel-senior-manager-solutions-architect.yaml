constraint_hypothesis:
  weakest_link: >-
    Vercel produces no more verified instant-navigation routes than its slowest
    part, the hand-written instant() end-to-end test, allows.
  binding_part: >-
    The hand-written instant() test from @next/playwright. Vercel's own
    validator checks whether a route has a static shell. It cannot check whether
    the right content is inside that shell. Only a person writing an instant()
    test can check that, one route at a time, and once for a page load and again
    for a click-through.
  output_capped: >-
    The number of customer routes that are proven instant and stay proven. That
    number is what a Solutions Architect signs off at the end of an enterprise
    migration to Next.js 16 Cache Components.
  confidence: medium
  narrowing_note: >-
    Vercel is large and has many public surfaces. I picked one before running
    the formula: Cache Components and instant navigation on the App Router. I
    did not diagnose Vercel as a whole. The Next.js core review queue is a
    separate and probably larger backlog, and I left it alone.

acquittal: EVIDENCE_SUFFICIENT

