    evidence row quotes it and why the "user check-ins, not agent judgment"
    sentence appears only in the reason field. A stranger can reach the same
    text by opening the directory URL in evidence row 5 and clicking SKILL.md.
    Quoting it from a source a stranger opens in one click would upgrade that
    row.
  - >-
    The sharpest sentence Vercel wrote is hidden inside a collapsed section of
    the instant navigation guide: "catching these issues by hand is difficult as
    the number of routes grows." It sits under the expander titled "How
    validation simulates different navigations." A stranger has to expand it, so
    verification runs past 20 seconds. I left it out of the evidence rows and am
    recording it here instead of smoothing it into a row it would fail.
  - >-
    I did not verify a dated AUD to USD rate, so the value of the band is stated
    only as clearing the floor. The record that would settle it is a dated rate
    quote on the day an offer is discussed. The currency label in
    data/queue.json still reads USD and nothing in this repository corrects it.
  - >-
    deformation_test_bank is the closer match in method to what this constraint
    needs, because it is a reusable protocol with written coding rules rather
    than one test file. It cannot be used. proof-ledger.yaml records its
    inspect_at as TODO_PUBLIC_URL, so no stranger can open it. This is the third
    diagnosis where that missing URL has cost something.
  - >-
    I read the Next.js tracker's headline counts, 2,000 open issues and 2,200
    open pull requests, and built nothing on them. More open pull requests than
    open issues is a real signal about core review capacity, but that is a
    different part of Vercel from the one named here, and P1 says name one.

