strikes:
  claims_tested: 17
  claims_struck: 11
  struck:
    - claim: >-
        binding_part: "Hand-authored attack scenarios."
      reason: >-
        This fails promise versus reality. The record shows the opposite of
        hand-authored. The one commit the claim rests on carries the trailer
        "Co-Authored-By: Claude Opus 4.8 (1M context)". An AI agent helped write
        those 13,396 lines. I read the crf-benchmark README and it never says
        how the scenarios were authored. No record shows a human writing them by
        hand. Evidence row 1 repeats the same wrong word when it says "20
        hand-built scenarios", so fix both places. Swapping "hand-authored" for
        "agent-assisted" does not save the constraint either. If one engineer
        plus an agent produced a 20-scenario bank in a single commit, that
        station is fast. The evidence undercuts the claim it was filed to
        support.
      rewrite: >-
        Gray Swan's public scenario banks are written by named engineers working
        with an AI agent. One engineer plus an agent produced a 20-scenario bank
        in one commit on 2026-05-31. How long that took, and whether it is slow
        enough to cap anything, is not public.

    - claim: >-
        output_capped: "The number of Arena challenges Gray Swan can run."
      reason: >-
        This fails prove the claim, and it breaks P3. Not one evidence row gives
        an Arena challenge count, a release cadence, or a scenario backlog. So
        the artifact never shows Gray Swan reaching this limit. The record I
        opened runs the other way. arXiv 2507.20526, which the diagnostician
        named in gap 3 and chose not to open, reports Gray Swan fielded 44
        deployment scenarios across 22 agents in a single public competition and
        absorbed 1.8 million attack attempts. A company that fields 44 scenarios
        at once is not visibly starved for scenarios. Narrowing the claim to
        public benchmark scenarios does not save it. crf-benchmark went from
        zero to 20 scenarios in one commit, which is a burst, not a queue.
      rewrite: null

    - claim: >-
        Evidence row 1: "The commit message says each scenario is a
        containerized target with LLM grading."
      reason: >-
        This fails prove the claim. I opened the commit. The message is one
