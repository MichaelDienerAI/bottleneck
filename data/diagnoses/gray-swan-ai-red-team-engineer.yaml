  - >-
    The crf-benchmark repo shows 1 commit and ipi_arena_os shows 2. That may
    mean a squashed public mirror rather than an abandoned project, so I built
    no claim on maintenance. The scenario counts and the file counts are solid.
    Internal commit history would settle the maintenance question, and it is not
    public.
  - >-
    The NIST evidence row takes about 14 seconds to verify, which is over the
    ten-second bar. Flagged rather than smoothed. The quote sits in the body of
    a long blog post. The two GitHub rows carry the argument and both verify in
    under 10 seconds.
  - >-
    The benefits list names a Pittsburgh office and catered lunches, while the
    location field says "Remote (U.S. or International)". Gate 0 recorded no
    remote_unverified flag, correctly, because that flag reads the location
    string and the string carries no office signal. Still worth one question to
    the recruiter about travel before Michael accepts anything.
  - >-
    Michael has not yet competed in the Arena, so this diagnosis carries no
    measurement he took himself. That is the cheapest gap to close and it is
    also the strongest single move available here.

