verdict: SHIP
reason: >-
  Why it is stuck. Gray Swan sells attack data to frontier labs. The Arena is
  where that data comes from. Attackers are not the scarce thing: NIST counted
  more than 250,000 attack attempts from over 400 participants in one Gray Swan
  competition. Scenarios are the scarce thing. Each scenario needs a person to
  build a working target and write a working exploit against it, and Gray Swan's
  own numbers show the price. Their public cyber benchmark reached 20 scenarios
  only after 251 files and 13,396 lines of code in a single drop. Their
  open-source prompt-injection benchmark enumerates 41 behaviors one at a time.
  So scenario writing sets the pace, and it is the bottleneck, meaning the one
  part whose capacity sits closest to its load and therefore caps everything
  behind it. Everything behind it is real revenue: Shade and Cygnal learn their
  attacks from Arena results, so a quarter with few new scenarios is a quarter
  with few new attack techniques to sell.

  How a fix would work, and the wrong guess. The obvious guess is that Gray Swan
  needs more red-teamers. That guess is wrong, and the NIST number kills it. Four
  hundred people already showed up for one event. Adding attackers adds pressure
  to a station that is not the constraint, which just piles up work in front of
  the one that is. What is missing is a repeatable way to turn one attack idea
  into many scenarios that a grader can score without a human reading each
  result. Note the honest limit on this reading: Gray Swan's paid Arena tooling
  is private, so I am reading their public benchmarks as the visible sample of
  private practice. That is an inference, and I am marking it as one.

  What to do with the evidence. Lead with the adversarial evaluation harness in
  aline-backend, and say plainly that it is agent-assisted, because Gray Swan's
  own CRF commit lists Claude Opus 4.8 as co-author and their technical interview
  is explicitly part AI-assisted. Then do the thing the posting itself rewards:
  the Arena is open to the public and "Experience as a Gray Swan Arena competitor
  is a plus." Competing produces a dated reading of their live product and a
  credential in the same act. Route the packet at the Chief Product Officer title
  and use Eliot Jones as the technical referral path, since he built the exact
  artifact this diagnosis rests on.
gaps:
