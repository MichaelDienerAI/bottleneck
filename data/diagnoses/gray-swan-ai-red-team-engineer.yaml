disconfirming:
  query_issued: >-
    Two kill queries, both issued after the hypothesis was written. First, a
    search for whether Arena breaks are verified automatically or by hand, which
    was aimed at my original hypothesis that manual break verification is the
    binding part. Second, a search asking whether Gray Swan's Shade product
    generates its own attack scenarios automatically, which was aimed at the
    narrowed hypothesis that scenario authorship is the binding part. If Shade
    writes its own scenarios, the narrowed hypothesis is dead.
  result: >-
    The first query killed my first hypothesis, and I am recording that rather
    than hiding it. Arena submissions are scored automatically by an AI judge
    with immediate feedback, and human review is only a second pass on
    already-approved breaks plus an appeals path. So hand verification does not
    cap how many attacks the Arena can absorb. I rewrote the hypothesis around
    scenario authorship. The second query did not kill the rewrite. Gray Swan's
    own Shade page describes Shade as "powered by attack data from the largest
    network of AI red teamers" with "attack strategies updated as new techniques
    are discovered in the Arena." Shade varies and replays what humans found in
    the Arena. It does not invent the scenarios. That makes the Arena the
    upstream station and Shade the downstream one, which is the opposite of a
    kill.
  survived: true

proof_match:
  asset: test_harness
  tier: sovereign
  acts_on_constraint: true
  mechanism: >-
    Gray Swan needs more graded attack scenarios, and today each one is built by
    hand. Michael built an adversarial evaluation harness, test-mra.js, that
    does that job. It names failure classes, including drift, sycophancy,
    fabricated continuity, and dependency-seeking behavior, and it gives each
    class a written pass or fail rule. That is the same shape as Gray Swan's own
    grader, which pairs a deterministic check with an LLM judge. The work is
    agent-assisted. Michael directs Claude Code and owns the requirements, the
    test design, and the acceptance. Gray Swan builds the same way, and their
    own commit trailer proves it: the CRF benchmark lists Claude Opus 4.8 as
    co-author. So the way Michael works is the house style here, not a
    liability.

